name: Bootstrap PROD Database

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  bootstrap:
    name: Bootstrap PostgreSQL
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    concurrency:
      group: production-db-bootstrap
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PROD_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.PROD_AWS_ACCOUNT_ID }}

      - name: Terraform init
        working-directory: infrastructure/terraform/prod
        run: |
          terraform init \
            -reconfigure \
            -backend-config="bucket=${{ vars.PROD_TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Bootstrap database
        run: |
          chmod +x scripts/bootstrap-prod-db.sh
          ./scripts/bootstrap-prod-db.sh