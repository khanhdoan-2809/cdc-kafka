name: CI
on:
  pull_request:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read # condition for using GITHUB_TOKEN

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify
        run: ./mvnw -B clean verify

  docker:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: transport-service
            dockerfile: transport-service/Dockerfile
          - image: audit-consumer
            dockerfile: audit-consumer/Dockerfile
      steps:
        - name: Checkout
          uses: actions/checkout@v7
        - name: Builder Docker Image
          run: |
            docker build \
              -f ${{ matrix.dockerfile }} \
              -t ${{ matrix.image }}:${{ github.sha }} \
              .

