name: CI

on:
  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Maven verify
        run: ./mvnw -B clean verify

  docker:
    name: Docker - ${{ matrix.service }}

    needs:
      - verify

    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: transport-service
            context: ./transport-service

          - service: audit-consumer
            context: ./audit-consumer

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        run: |
          docker build \
            -t "${{ matrix.service }}:ci" \
            "${{ matrix.context }}"