name: Deploy DEV

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

concurrency:
  group: dev-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Maven verify
        run: ./mvnw -B clean verify

  build:
    name: Build ${{ matrix.service }}

    needs:
      - verify

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        include:
          - service: transport-service
            repository: cdc-kafka-transport-service
            context: ./transport-service

          - service: audit-consumer
            repository: cdc-kafka-audit-consumer
            context: ./audit-consumer

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cdc-kafka-github-dev-deploy
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check image
        id: image
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "${{ matrix.repository }}" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            >/dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.image.outputs.exists != 'true'
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${{ matrix.repository }}:${GITHUB_SHA}" \
            "${{ matrix.context }}"

      - name: Push image
        if: steps.image.outputs.exists != 'true'
        run: |
          docker push \
            "${ECR_REGISTRY}/${{ matrix.repository }}:${GITHUB_SHA}"

  deploy:
    name: Deploy DEV

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cdc-kafka-github-dev-deploy
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Find DEV EC2
        id: instance
        shell: bash
        run: |
          INSTANCE_ID="$(
            aws ec2 describe-instances \
              --filters \
                "Name=tag:Project,Values=cdc-kafka" \
                "Name=tag:Environment,Values=dev" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId | [0]" \
              --output text
          )"

          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "DEV EC2 instance not found"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[
                'cd /opt/cdc-kafka',
                'git fetch origin dev',
                'git reset --hard ${GITHUB_SHA}',
                'chmod +x scripts/deploy-dev.sh',
                './scripts/deploy-dev.sh ${AWS_REGION} ${ECR_REGISTRY} ${GITHUB_SHA}'
              ]" \
              --query "Command.CommandId" \
              --output text
          )"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text

      - name: Show deployment output
        if: always()
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          echo "DEV deployment finished for commit ${GITHUB_SHA}"