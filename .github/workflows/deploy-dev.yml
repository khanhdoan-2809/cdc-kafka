name: Deploy DEV

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "infrastructure/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdc-kafka-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.DEV_AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_aws_account_id: ${{ vars.DEV_AWS_ACCOUNT_ID }}
  TF_VAR_developer_cidr: ${{ vars.DEV_DEVELOPER_CIDR }}

jobs:
  verify:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: chmod +x mvnw && ./mvnw -B clean verify

  build:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        include:
          - repository: cdc-kafka-transport-service
            context: ./transport-service
          - repository: cdc-kafka-audit-consumer
            context: ./audit-consumer

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.DEV_AWS_ACCOUNT_ID }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether the SHA image already exists
        id: image
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          if aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        env:
          REPOSITORY: ${{ matrix.repository }}
          CONTEXT: ${{ matrix.context }}
        run: |
          IMAGE="$ECR_REGISTRY/$REPOSITORY:$GITHUB_SHA"
          docker build -t "$IMAGE" "$CONTEXT"
          docker push "$IMAGE"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.DEV_AWS_ACCOUNT_ID }}

      - name: Find running DEV EC2
        id: instance
        run: |
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=cdc-kafka" \
              "Name=tag:Environment,Values=dev" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)"

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "Running DEV EC2 instance not found" >&2
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM agent
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          for attempt in {1..60}; do
            STATUS="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)"

            if [[ "$STATUS" == "Online" ]]; then exit 0; fi
            sleep 10
          done

          echo "SSM agent did not become online" >&2
          exit 1

      - name: Deploy and smoke test via SSM
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          REMOTE_COMMAND=$(cat <<EOF_REMOTE
          set -eu

          if [ ! -d /opt/cdc-kafka/.git ]; then
            rm -rf /opt/cdc-kafka
            git clone --branch dev --single-branch \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              /opt/cdc-kafka
          fi

          cd /opt/cdc-kafka
          git fetch origin dev
          git reset --hard ${GITHUB_SHA}

          bash scripts/deploy-dev.sh \
            '${AWS_REGION}' '${ECR_REGISTRY}' '${GITHUB_SHA}'

          bash scripts/smoke-test-dev.sh '${GITHUB_SHA}'
          EOF_REMOTE
          )

          PARAMETERS="$(jq -nc \
            --arg command "$REMOTE_COMMAND" \
            '{commands:[$command],executionTimeout:["2100"]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in {1..180}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|Cancelling|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" || true
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "SSM command timed out: $COMMAND_ID" >&2
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true
          exit 1
