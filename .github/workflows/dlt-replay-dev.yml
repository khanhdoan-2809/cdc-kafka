name: DEV DLT Replay

on:
  workflow_dispatch:
    inputs:
      action:
        description: DLT replay action
        required: true
        type: choice
        options:
          - status
          - start
          - stop

permissions:
  contents: read

concurrency:
  group: dev-dlt-replay
  cancel-in-progress: false

jobs:
  replay:
    name: DLT Replay

    if: github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.DEV_AWS_ACCOUNT_ID }}

      - name: Find DEV EC2
        id: instance
        shell: bash
        run: |
          INSTANCE_ID="$(
            aws ec2 describe-instances \
              --filters \
                "Name=tag:Project,Values=cdc-kafka" \
                "Name=tag:Environment,Values=dev" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId | [0]" \
              --output text
          )"

          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "DEV EC2 not found"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Run DLT replay action
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          COMMAND="cd /opt/cdc-kafka && chmod +x scripts/dlt-replay-dev.sh && ./scripts/dlt-replay-dev.sh ${ACTION}"

          PARAMETERS="$(
            jq -n \
              --arg command "${COMMAND}" \
              '{commands: [$command]}'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "DEV DLT replay ${ACTION}" \
              --parameters "${PARAMETERS}" \
              --query "Command.CommandId" \
              --output text
          )"

          if ! aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"; then

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}"

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text