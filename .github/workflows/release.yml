name: Release PROD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  TRANSPORT_ECR_REPOSITORY: cdc-kafka-transport-service
  AUDIT_ECR_REPOSITORY: cdc-kafka-audit-consumer

  ECS_CLUSTER: cdc-kafka-prod

  TRANSPORT_SERVICE: transport-service
  AUDIT_SERVICE: audit-consumer

  TRANSPORT_TASK_FAMILY: cdc-kafka-prod-transport-service
  AUDIT_TASK_FAMILY: cdc-kafka-prod-audit-consumer

  TRANSPORT_DESIRED_COUNT: 2
  AUDIT_DESIRED_COUNT: 1

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and commit
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must already be on main" >&2
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure PROD AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.PROD_AWS_ACCOUNT_ID }}

      - name: Login to PROD ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Image names
        id: images
        run: |
          echo "transport=${{ steps.ecr.outputs.registry }}/${TRANSPORT_ECR_REPOSITORY}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "audit=${{ steps.ecr.outputs.registry }}/${AUDIT_ECR_REPOSITORY}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push transport image
        env:
          IMAGE: ${{ steps.images.outputs.transport }}
        run: |
          if aws ecr describe-images \
            --repository-name "$TRANSPORT_ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_REF_NAME" \
            >/dev/null 2>&1; then

            echo "Transport image already exists; reusing immutable tag"
          else
            docker build -t "$IMAGE" ./transport-service
            docker push "$IMAGE"
          fi

      - name: Build and push audit image
        env:
          IMAGE: ${{ steps.images.outputs.audit }}
        run: |
          if aws ecr describe-images \
            --repository-name "$AUDIT_ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_REF_NAME" \
            >/dev/null 2>&1; then

            echo "Audit image already exists; reusing immutable tag"
          else
            docker build -t "$IMAGE" ./audit-consumer
            docker push "$IMAGE"
          fi

      # Deploy Audit Consumer first.

      - name: Download audit task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$AUDIT_TASK_FAMILY" \
            --query taskDefinition > audit-task-definition.json

      - name: Render audit task definition
        id: audit-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.0
        with:
          task-definition: audit-task-definition.json
          container-name: audit-consumer
          image: ${{ steps.images.outputs.audit }}

      - name: Deploy audit consumer
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.3
        with:
          task-definition: ${{ steps.audit-task.outputs.task-definition }}
          service: ${{ env.AUDIT_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Ensure audit consumer is running
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$AUDIT_SERVICE" \
            --desired-count "$AUDIT_DESIRED_COUNT" >/dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$AUDIT_SERVICE"

      # Deploy Transport Service.

      - name: Download transport task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TRANSPORT_TASK_FAMILY" \
            --query taskDefinition > transport-task-definition.json

      - name: Render transport task definition
        id: transport-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.0
        with:
          task-definition: transport-task-definition.json
          container-name: transport-service
          image: ${{ steps.images.outputs.transport }}

      - name: Deploy transport service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.3
        with:
          task-definition: ${{ steps.transport-task.outputs.task-definition }}
          service: ${{ env.TRANSPORT_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Ensure transport service is running
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$TRANSPORT_SERVICE" \
            --desired-count "$TRANSPORT_DESIRED_COUNT" >/dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$TRANSPORT_SERVICE"

      # Final verification.

      - name: Verify both ECS services
        run: |
          for entry in "$AUDIT_SERVICE:$AUDIT_DESIRED_COUNT" "$TRANSPORT_SERVICE:$TRANSPORT_DESIRED_COUNT"; do
            service="${entry%%:*}"
            expected="${entry##*:}"

            result="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service")"

            echo "$result" | jq -e --argjson expected "$expected" '
              (.failures | length) == 0 and
              (.services | length) == 1 and
              (.services[0].status == "ACTIVE") and
              (.services[0].desiredCount == $expected) and
              (.services[0].runningCount == $expected) and
              (.services[0].pendingCount == 0)
            ' >/dev/null || {
              echo "ECS service $service is not healthy" >&2
              exit 1
            }

            echo "ECS $service: $expected tasks running"
          done
