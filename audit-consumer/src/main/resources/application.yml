spring:
  application:
    name: audit-consumer

  datasource:
    url: jdbc:postgresql://${AUDIT_DB_HOST:localhost}:${AUDIT_DB_PORT:5433}/${AUDIT_DB_NAME:audit}
    username: ${AUDIT_DB_USERNAME:audit}
    password: ${AUDIT_DB_PASSWORD:audit}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: audit-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info

audit:
  kafka:
    topics:
      transport: transport.public.transport
      job: transport.public.job
      container: transport.public.container