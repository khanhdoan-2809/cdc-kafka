services:
  transport-postgres:
    image: postgres:17
    container_name: transport-postgres

    environment:
      POSTGRES_DB: ${TRANSPORT_DB_NAME:-transport}
      POSTGRES_USER: ${TRANSPORT_DB_USERNAME:-transport}
      POSTGRES_PASSWORD: ${TRANSPORT_DB_PASSWORD:-transport}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=1GB
    volumes:
      - transport-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-postgres:
    image: postgres:17
    container_name: audit-postgres
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:-audit}
      POSTGRES_USER: ${AUDIT_DB_USERNAME:-audit}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}
    ports:
      - "5433:5432"
    volumes:
      - audit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-volume-init:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - kafka-data:/data
    command: chown -R 1000:1000 /data
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: transport-kafka
    ports:
      - "9092:9092"
    environment:
      # Unique identity for kafka cluster
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      # Unique identity of this node in the cluster
      KAFKA_NODE_ID: 1
      # broker: receives producer messages, stores partitions, serves consumers; controller: manages metadata, such as topics, partitions, and partition leaders.
      KAFKA_PROCESS_ROLES: "broker,controller"

      # controller node id + hostname + controller communication port
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Listener security protocols
      # CONTROLLER: controller traffic; PLAINTEXT: docker client and broker traffic; PLAINTEXT_HOST: clients on your computer
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"

      # tell Kafka which addresses to return to clients
      # same Docker network: kafka:19092, my computer: localhost:9092
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"

      # Selecting listeners for Kafka’s internal communication
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      kafka-volume-init:
        condition: service_started
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  kafka-connect:
    image: quay.io/debezium/connect:3.6
    container_name: transport-kafka-connect
    ports:
      - "8083:8083"
      - "9012:9012"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: transport-connect

      CONFIG_STORAGE_TOPIC: transport_connect_configs
      OFFSET_STORAGE_TOPIC: transport_connect_offsets
      STATUS_STORAGE_TOPIC: transport_connect_statuses

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_CONFIG_STORAGE_PARTITIONS: 1
      CONNECT_OFFSET_STORAGE_PARTITIONS: 25
      CONNECT_STATUS_STORAGE_PARTITIONS: 5

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_TOPIC_CREATION_ENABLE: "true"

      JMXPORT: 9012
      JMXHOST: 0.0.0.0
      JMXAUTH: "false"
      JMXSSL: "false"
    depends_on:
      kafka:
        condition: service_healthy
      transport-postgres:
        condition: service_healthy

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Kafka address from inside Docker network
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      # Also expose our Debezium Kafka Connect instance in the UI
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      - kafka
      - kafka-connect

  debezium-init:
    image: alpine:3.22
    container_name: debezium-init

    depends_on:
      kafka-connect:
        condition: service_started

    volumes:
      - ./docker/debezium/transport-postgres-connector.json:/config/connector.json:ro

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        apk add --no-cache curl jq

        echo "Waiting for Kafka Connect..."

        until curl -fsS http://kafka-connect:8083/connector-plugins > /dev/null; do
          echo "Kafka Connect is not ready yet..."
          sleep 2
        done

        echo "Kafka Connect is ready"

        echo "Original connector file:"
        cat /config/connector.json

        jq '.config' /config/connector.json > /tmp/connector-config.json

        echo
        echo "Configuration being sent:"
        cat /tmp/connector-config.json

        echo
        echo "Registering transport-postgres-cdc..."

        curl -fSs \
          -X PUT \
          -H "Content-Type: application/json" \
          --data-binary @/tmp/connector-config.json \
          http://kafka-connect:8083/connectors/transport-postgres-cdc/config

        echo
        echo "Connector registered successfully"

        echo
        echo "Current connectors:"

        curl -fSs http://kafka-connect:8083/connectors

        echo

    restart: "no"

  transport-service:
    build:
      context: ./transport-service
    container_name: transport-service
    environment:
      DB_HOST: transport-postgres
      DB_PORT: 5432
      DB_NAME: ${TRANSPORT_DB_NAME:-transport}
      DB_USERNAME: ${TRANSPORT_DB_USERNAME:-transport}
      DB_PASSWORD: ${TRANSPORT_DB_PASSWORD:-transport}
    ports:
      - "8080:8080"
    depends_on:
      transport-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  audit-consumer:
    build:
      context: ./audit-consumer
    container_name: audit-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      AUDIT_DB_HOST: audit-postgres
      AUDIT_DB_PORT: 5432
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-audit}
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME:-audit}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}

      AUDIT_KAFKA_CONCURRENCY: 3
      AUDIT_KAFKA_MAX_POLL_RECORDS: 100

      AUDIT_DLT_REPLAY_ENABLED: "false"
      AUDIT_DLT_REPLAY_GROUP_ID: audit-dlt-replay

      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: transport-postgres:5432/${TRANSPORT_DB_NAME:-transport}?sslmode=disable
      DATA_SOURCE_USER: ${TRANSPORT_DB_USERNAME:-transport}
      DATA_SOURCE_PASS: ${TRANSPORT_DB_PASSWORD:-transport}
    ports:
      - "9187:9187"
    depends_on:
      - transport-postgres

volumes:
  transport-postgres-data:
  audit-postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data: