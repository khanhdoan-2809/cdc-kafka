global:
  scrape_interval: 10s

scrape_configs:
  - job_name: transport-service
    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - transport-service:8080

  - job_name: audit-consumer
    metrics_path: /actuator/prometheus

    dns_sd_configs:
      - names:
          - audit-consumer
        type: A
        port: 8081
        refresh_interval: 5s

  - job_name: transport-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: audit-postgres
    static_configs:
      - targets:
          - audit-postgres-exporter:9187