spring:
  application:
    name: transport

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transport}
    username: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transport}
    user: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [actorId=%X{actorId}] [requestId=%X{requestId}] [correlationId=%X{correlationId}] %logger{36} - %msg%n"