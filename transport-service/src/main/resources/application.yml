spring:
  application:
    name: transport

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transport}
    username: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport}

    hikari:
      maximum-pool-size: ${TRANSPORT_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${TRANSPORT_DB_MIN_IDLE:2}
      connection-timeout: ${TRANSPORT_DB_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transport}
    user: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [actorId=%X{actorId}] [requestId=%X{requestId}] [correlationId=%X{correlationId}] %logger{36} - %msg%n"