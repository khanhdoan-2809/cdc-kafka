spring:
  application:
    name: transport

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transport}
    username: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport}

    hikari:
      maximum-pool-size: ${TRANSPORT_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${TRANSPORT_DB_MIN_IDLE:2}
      connection-timeout: ${TRANSPORT_DB_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transport}
    user: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

jwt:
  private-key: ${JWT_PRIVATE_KEY}  # Dùng để sign token
  public-key: ${JWT_PUBLIC_KEY}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  # expiration: 3600000  # 1 hour (cấu hình cũ; đã thay bằng ttl bên dưới)
  ttl: ${JWT_TTL:PT15M}

auth:
  bootstrap:
    username: ${AUTH_BOOTSTRAP_USERNAME:}
    password: ${AUTH_BOOTSTRAP_PASSWORD:}
    email: ${AUTH_BOOTSTRAP_EMAIL:}
  registration:
    enabled: ${AUTH_REGISTRATION_ENABLED:false}
    max-attempts: ${AUTH_REGISTRATION_MAX_ATTEMPTS:10}
  verification:
    from: ${AUTH_VERIFICATION_FROM:no-reply@cdc-kafka.local}
  login:
    max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:10}
    max-peers: ${AUTH_LOGIN_MAX_PEERS:10000}
    window: ${AUTH_LOGIN_WINDOW:PT1M}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [actorId=%X{actorId}] [requestId=%X{requestId}] [correlationId=%X{correlationId}] %logger{36} - %msg%n"
monitoring:
  password: ${MONITORING_PASSWORD}
